<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java 學習歷程 - 個人網站</title>
  
  <!-- Google Fonts: Outfit for body, Fira Code for code blocks -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Prism.js for Java and code block syntax highlighting (Dracula/Tomorrow Dark theme style) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
  
  <!-- Marked.js for parsing Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: rgba(17, 24, 39, 0.7);
      --bg-sidebar: rgba(15, 23, 42, 0.85);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --accent-hover-gradient: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
      --primary: #818cf8;
      --secondary: #c084fc;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --font-sans: 'Outfit', 'Noto Sans TC', sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(11, 15, 25, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(99, 102, 241, 0.6);
    }

    /* Glassmorphism Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(11, 15, 25, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 40px;
      z-index: 1000;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.3rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .logo i {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.5rem;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .part-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .part-btn:hover, .part-btn.active {
      background: var(--accent-gradient);
      border-color: transparent;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }

    .github-link {
      color: var(--text-muted);
      font-size: 1.5rem;
      transition: color 0.3s ease;
      text-decoration: none;
    }

    .github-link:hover {
      color: var(--primary);
    }

    /* Sidebar Mobile Toggle */
    .menu-toggle {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Layout Structure */
    .app-container {
      display: flex;
      margin-top: 70px;
      min-height: calc(100vh - 70px);
      position: relative;
    }

    /* Left Sidebar: Table of Contents */
    aside {
      width: 300px;
      position: fixed;
      top: 70px;
      bottom: 0;
      left: 0;
      background: var(--bg-sidebar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-color);
      padding: 30px 20px;
      overflow-y: auto;
      z-index: 900;
      transition: transform 0.3s ease;
    }

    .sidebar-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--primary);
      margin-bottom: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toc-list {
      list-style: none;
    }

    .toc-item {
      margin-bottom: 8px;
    }

    .toc-link {
      display: block;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s ease;
      border-left: 2px solid transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toc-link:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
      padding-left: 16px;
    }

    .toc-link.active {
      color: var(--secondary);
      background: rgba(168, 85, 247, 0.1);
      border-left-color: var(--secondary);
      font-weight: 500;
    }

    .toc-item.level-3 {
      margin-left: 15px;
    }
    .toc-item.level-3 .toc-link {
      font-size: 0.85rem;
    }

    /* Main Content Area */
    main {
      flex: 1;
      margin-left: 300px;
      padding: 40px 60px;
      max-width: 1000px;
      position: relative;
    }

    /* Skeleton Loading State */
    .loading-skeleton {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .skeleton-line {
      height: 20px;
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 4px;
    }

    .skeleton-line.title {
      height: 40px;
      width: 60%;
      margin-bottom: 10px;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Custom styles for rendered Markdown */
    .markdown-body {
      line-height: 1.7;
      font-size: 1.05rem;
    }

    /* Headings */
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4 {
      color: var(--text-main);
      font-weight: 700;
      margin-top: 35px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .markdown-body h1 {
      font-size: 2.2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .markdown-body h2 {
      font-size: 1.7rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }
    
    .markdown-body h2::before {
      content: "";
      position: absolute;
      left: -18px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 20px;
      background: var(--accent-gradient);
      border-radius: 2px;
    }

    .markdown-body h3 {
      font-size: 1.3rem;
      color: var(--primary);
    }

    .markdown-body h4 {
      font-size: 1.1rem;
      color: var(--secondary);
    }

    /* Paragraphs and Inline elements */
    .markdown-body p {
      margin-bottom: 16px;
      color: #d1d5db;
    }

    .markdown-body a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s ease, border-bottom 0.2s ease;
      border-bottom: 1px dashed rgba(129, 207, 248, 0.4);
    }

    .markdown-body a:hover {
      color: var(--secondary);
      border-bottom-style: solid;
    }

    .markdown-body strong {
      color: #fff;
      font-weight: 600;
      background: rgba(129, 207, 248, 0.08);
      padding: 0 4px;
      border-radius: 4px;
    }

    /* Lists and Checkboxes */
    .markdown-body ul, 
    .markdown-body ol {
      margin-bottom: 20px;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 8px;
      color: #d1d5db;
    }

    /* Special styling for Task List / Checkboxes in Markdown */
    .markdown-body li.task-list-item {
      list-style-type: none;
      position: relative;
      padding-left: 28px;
    }

    .markdown-body li.task-list-item input[type="checkbox"] {
      position: absolute;
      left: 0;
      top: 5px;
      width: 18px;
      height: 18px;
      appearance: none;
      -webkit-appearance: none;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1.5px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      display: inline-block;
      outline: none;
      transition: all 0.2s ease;
    }

    .markdown-body li.task-list-item input[type="checkbox"]:checked {
      background: var(--accent-gradient);
      border-color: transparent;
    }

    .markdown-body li.task-list-item input[type="checkbox"]:checked::after {
      content: "\f00c";
      font-family: "Font Awesome 5 Free";
      font-weight: 900;
      color: white;
      font-size: 10px;
      position: absolute;
      top: 2px;
      left: 3px;
    }

    /* Code Blocks */
    .markdown-body pre {
      background-color: rgba(15, 23, 42, 0.8) !important;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px !important;
      margin: 24px 0 !important;
      overflow-x: auto;
      box-shadow: var(--glass-shadow);
      position: relative;
    }

    .markdown-body code {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 3px 6px;
      border-radius: 6px;
      color: #f43f5e;
    }

    .markdown-body pre code {
      background: transparent !important;
      padding: 0 !important;
      border-radius: 0 !important;
      color: #f3f4f6 !important;
    }

    /* Blockquotes */
    .markdown-body blockquote {
      border-left: 4px solid var(--primary);
      background: rgba(99, 102, 241, 0.05);
      padding: 16px 20px;
      margin: 20px 0;
      border-radius: 0 8px 8px 0;
      color: #e5e7eb;
      font-style: italic;
    }

    /* Tables */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 25px 0;
      font-size: 0.95rem;
      box-shadow: var(--glass-shadow);
      border-radius: 8px;
      overflow: hidden;
    }

    .markdown-body th, 
    .markdown-body td {
      padding: 12px 15px;
      border: 1px solid var(--border-color);
      text-align: left;
    }

    .markdown-body th {
      background-color: rgba(99, 102, 241, 0.15);
      color: #fff;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
    }

    .markdown-body tr {
      background-color: rgba(17, 24, 39, 0.4);
      transition: background-color 0.2s ease;
    }

    .markdown-body tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--primary);
      padding: 12px 24px;
      border-radius: 8px;
      box-shadow: var(--glass-shadow);
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateY(150%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .toast.show {
      transform: translateY(0);
    }

    /* Local File Warning Box */
    .local-warning {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      display: none;
    }
    .local-warning h3 {
      color: #ef4444;
      margin-top: 0 !important;
      margin-bottom: 10px;
      font-size: 1.1rem;
    }

    /* Responsive Design */
    @media (max-width: 992px) {
      aside {
        transform: translateX(-100%);
      }
      
      aside.open {
        transform: translateX(0);
      }

      main {
        margin-left: 0;
        padding: 30px 24px;
      }

      .menu-toggle {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- Premium Header -->
  <header>
    <div class="logo">
      <i class="fa-solid fa-code"></i>
      <span>Java 學習歷程 Log</span>
    </div>
    
    <div class="nav-controls">
      <button class="part-btn active" onclick="loadMarkdownFile('Java學習歷程（Part-1） (1).md', this)">
        <i class="fa-solid fa-book-open"></i> Part 1
      </button>
      <button class="part-btn" onclick="loadMarkdownFile('Java學習歷程（Part-2） (2).md', this)">
        <i class="fa-solid fa-book-open"></i> Part 2
      </button>
      <a href="https://github.com" target="_blank" class="github-link" title="GitHub Repo">
        <i class="fa-brands fa-github"></i>
      </a>
      <button class="menu-toggle" id="menuToggleBtn">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <!-- Main Layout Container -->
  <div class="app-container">
    
    <!-- Sidebar: Table of Contents -->
    <aside id="sidebar">
      <div class="sidebar-title">
        <i class="fa-solid fa-compass"></i>
        <span>章節目錄</span>
      </div>
      <ul class="toc-list" id="tocList">
        <!-- Will be populated dynamically -->
      </ul>
    </aside>

    <!-- Main Content Area -->
    <main>
      <!-- CORS/Local warning (hidden by default) -->
      <div class="local-warning" id="localWarning">
        <h3><i class="fa-solid fa-circle-exclamation"></i> 瀏覽器安全限制 (CORS Error)</h3>
        <p>因為您是直接雙擊點開 HTML 檔案 (網址列為 <code>file://...</code>)，瀏覽器的安全性限制會阻擋動態讀取 (Fetch) 本地的 Markdown 檔案。</p>
        <p style="margin-top: 10px;"><strong>解決方案：</strong></p>
        <ul style="margin-top: 5px; padding-left: 20px;">
          <li>將這些檔案上傳到 <strong>GitHub Pages</strong> 後就能完美運作！</li>
          <li><b>本機測試：</b>使用 VS Code 的 <strong>Live Server</strong> 插件，或在當前目錄執行命令 <code>npx serve</code> 或 <code>python -m http.server</code>，再透過 <code>http://localhost:3000</code> 等網址開啟。</li>
        </ul>
      </div>

      <!-- Markdown Output Container -->
      <div class="markdown-body" id="content">
        <!-- Loading Skeleton -->
        <div class="loading-skeleton">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line" style="width: 90%;"></div>
          <div class="skeleton-line" style="width: 80%;"></div>
          <div class="skeleton-line" style="width: 95%;"></div>
          <div class="skeleton-line" style="width: 60%;"></div>
          <br>
          <div class="skeleton-line title" style="width: 40%"></div>
          <div class="skeleton-line" style="width: 85%;"></div>
          <div class="skeleton-line" style="width: 90%;"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check" style="color: var(--primary);"></i>
    <span id="toastMsg">載入成功！</span>
  </div>

  <!-- Prism.js core + Autoloader (loads languages dynamically like Java) -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <script>
    // Custom renderer for Marked.js to handle task lists beautifully
    const renderer = new marked.Renderer();
    
    // Custom task list item layout
    renderer.listitem = function(text, task, checked) {
      if (task) {
        return `<li class="task-list-item">
          <input type="checkbox" ${checked ? 'checked' : ''} disabled>
          ${text.replace(/^\[[ xX]\]\s*/, '')}
        </li>`;
      }
      return `<li>${text}</li>`;
    };

    marked.setOptions({
      renderer: renderer,
      gfm: true,
      breaks: true,
      headerIds: true,
      mangle: false
    });

    // Mobile sidebar toggle logic
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const sidebar = document.getElementById('sidebar');
    
    menuToggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      const icon = menuToggleBtn.querySelector('i');
      if (sidebar.classList.contains('open')) {
        icon.className = 'fa-solid fa-xmark';
      } else {
        icon.className = 'fa-solid fa-bars';
      }
    });

    // Load Markdown and render
    async function loadMarkdownFile(filename, element) {
      // Show skeleton loader
      const contentDiv = document.getElementById('content');
      contentDiv.innerHTML = `
        <div class="loading-skeleton">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line" style="width: 90%;"></div>
          <div class="skeleton-line" style="width: 80%;"></div>
          <div class="skeleton-line" style="width: 95%;"></div>
        </div>`;
      
      // Update active nav button
      if (element) {
        document.querySelectorAll('.part-btn').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
      }

      // Close mobile sidebar on transition
      sidebar.classList.remove('open');
      const toggleIcon = menuToggleBtn.querySelector('i');
      if (toggleIcon) toggleIcon.className = 'fa-solid fa-bars';

      // Check CORS issues if running locally via file://
      if (window.location.protocol === 'file:') {
        document.getElementById('localWarning').style.display = 'block';
      }

      try {
        // Fetch the file
        const response = await fetch(filename);
        if (!response.ok) {
          throw new Error(`找不到檔案 ${filename}`);
        }
        
        let mdText = await response.text();
        
        // Remove front-matter (e.g. metadata between --- lines at the top of markdown)
        mdText = mdText.replace(/^---[\s\S]*?---/, '');
        
        // Render Markdown to HTML
        const htmlContent = marked.parse(mdText);
        contentDiv.innerHTML = htmlContent;

        // Parse TOC headings from content
        generateTOC();

        // Highlight code blocks with Prism.js
        Prism.highlightAllUnder(contentDiv);

        showToast(`成功載入 ${filename}`);
        document.getElementById('localWarning').style.display = 'none';
      } catch (error) {
        console.error(error);
        contentDiv.innerHTML = `
          <div style="padding: 20px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); border-radius: 8px;">
            <h3 style="color: #ef4444; margin-bottom: 10px;"><i class="fa-solid fa-triangle-exclamation"></i> 載入失敗</h3>
            <p>無法載入 ${filename}，請檢查檔案是否存在於同個資料夾。</p>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">錯誤細節: ${error.message}</p>
          </div>
        `;
      }
    }

    // Dynamic Table of Contents Generation
    function generateTOC() {
      const tocList = document.getElementById('tocList');
      tocList.innerHTML = '';
      
      // Select all H2 and H3 elements inside the parsed markdown
      const headings = document.querySelectorAll('#content h2, #content h3');
      
      headings.forEach((heading, index) => {
        // Set unique ID for each heading if not present
        if (!heading.id) {
          heading.id = 'heading-' + index;
        }

        const li = document.createElement('li');
        li.className = 'toc-item';
        if (heading.tagName === 'H3') {
          li.classList.add('level-3');
        }

        const a = document.createElement('a');
        a.href = '#' + heading.id;
        a.className = 'toc-link';
        a.innerText = heading.innerText.replace(/^[⭐#\s]+/, ''); // Clean prefixes if any
        
        li.appendChild(a);
        tocList.appendChild(li);
      });

      // ScrollSpy: highlight TOC link on scroll
      setupScrollSpy();
    }

    // ScrollSpy function to highlight active heading in sidebar
    function setupScrollSpy() {
      const links = document.querySelectorAll('.toc-link');
      const headings = document.querySelectorAll('#content h2, #content h3');
      
      window.onscroll = () => {
        let currentActive = '';
        
        headings.forEach(heading => {
          const headingTop = heading.offsetTop;
          if (window.scrollY >= headingTop - 100) {
            currentActive = heading.id;
          }
        });

        links.forEach(link => {
          link.classList.remove('active');
          if (link.getAttribute('href') === '#' + currentActive) {
            link.classList.add('active');
          }
        });
      };
    }

    // Show beautiful toast notification
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Initial Load: Load Part 1 on page load
    window.addEventListener('DOMContentLoaded', () => {
      // By default load Part-1. Double check actual filename spacing
      loadMarkdownFile('Java學習歷程（Part-1） (1).md');
    });
  </script>
</body>
</html>
